[package]
name = "pelagic-render-gpu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gauravvvvvvvvvv/pelagic"
description = "Native GPU rendering backend for Pelagic"

[dependencies]
pelagic = { path = "../.." }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
png = "0.18.1"
